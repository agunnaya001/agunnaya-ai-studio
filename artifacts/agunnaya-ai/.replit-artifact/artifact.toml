kind = "web"
previewPath = "/"
title = "Agunnaya AI Studio"
version = "1.0.0"
id = "artifacts/agunnaya-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25975

[services.development]
run = "pnpm --filter @workspace/agunnaya-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agunnaya-ai", "run", "build" ]
publicDir = "artifacts/agunnaya-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25975"
BASE_PATH = "/"
